name: Area labels
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute code from a pull request in this privileged workflow.
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
