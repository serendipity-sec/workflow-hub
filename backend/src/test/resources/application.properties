# 테스트는 실제 S3에 접속하지 않으므로 버킷 이름은 아무 값이나 된다.
app.storage.bucket=test-bucket
# 테스트에서는 정리 작업을 직접 호출한다. 백그라운드 실행이 같은 행을 먼저 처리하지 않도록 간격을 길게 둔다.
app.storage.cleanup-interval=1h
# 테스트는 실제 SQS에 접속하지 않으므로 큐 URL과 워커 토큰은 테스트용 값을 사용한다.
app.analysis.queue-url=https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-scan-queue
app.analysis.worker-tokens=test-worker-token-primary,test-worker-token-secondary
# 테스트에서는 만료 회수 작업을 직접 호출한다.
app.analysis.lease-recovery-interval=1h
