name: 개발 작업
description: 한 PR로 검토할 수 있는 작업을 정의합니다.
title: '[Task] '
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 제외 범위
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증 방법
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 관련 계약·선행 작업
