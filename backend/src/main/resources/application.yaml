server:
  port: ${PORT:8080}
spring:
  application:
    name: workflow-hub-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    default-schema: workflow_hub
app:
  auth:
    issuer: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
    jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
    audience: authenticated
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
