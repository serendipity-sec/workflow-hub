name: Worker assessment
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker-assessment.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['worker/**', '.github/workflows/worker-assessment.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-assessment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: worker/.node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: node validation/verify-static-corpus.mjs evidence-local/ci-static-results.json
      - run: node validation/verify-legacy-current.mjs evidence-local/ci-legacy-results.json
      - name: Build the pinned assessment runtime
        run: |
          docker build -f Dockerfile.assessment-runtime -t workflow-worker-assessment-runtime:0.10.0 .
          docker build -f Dockerfile.assessment --build-arg RUNTIME_IMAGE=workflow-worker-assessment-runtime:0.10.0 -t workflow-worker-assessment:0.10.0 .
      - name: Verify actual tools and OS isolation
        run: |
          export WORKER_DOCKER_PATH="$(command -v docker)"
          export WORKER_ASSESSMENT_IMAGE="$(docker image inspect --format '{{.Id}}' workflow-worker-assessment:0.10.0)"
          node validation/verify-assessment-runtime.mjs
          node validation/verify-native-profile.mjs
        env:
          WORKER_ASSESSMENT_VALIDATION_OUTPUT: evidence-local/ci-assessment-results.json
