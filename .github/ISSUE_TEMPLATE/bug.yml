name: 버그 보고
description: 재현 가능한 오류를 보고합니다.
title: '[Bug] '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 실행 환경과 재현 순서를 적어 주세요. 비밀키나 실제 사용자 JSON은 첨부하지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 검증 자료
      description: 민감정보를 제거한 로그나 화면을 첨부해 주세요.
