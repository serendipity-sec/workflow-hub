openapi: 3.0.3
info:
  title: Workflow Hub API
  version: 0.1.0
  description: Implemented foundation endpoints only. Workflow and S3 APIs are not implemented yet.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: health
    description: Service availability
  - name: auth
    description: Authenticated identity
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check service availability
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]
        '500':
          description: Unexpected server failure
  /api/me:
    get:
      operationId: getCurrentUser
      summary: Read the verified Supabase user identity
      tags: [auth]
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: Verified Supabase JWT subject
        '401':
          description: Missing or invalid user access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Authentication required
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Access denied
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access token; Google tokens and service-role keys are not accepted.
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
